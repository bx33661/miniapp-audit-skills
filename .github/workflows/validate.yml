name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skills
        run: python scripts/validate_skills.py --strict

      - name: Check links
        run: python scripts/check_links.py

      - name: Check output contracts and extractors
        run: python -m unittest discover -s evals -p 'test_*.py'
